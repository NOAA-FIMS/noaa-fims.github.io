name: FIMS community digest

on:
  workflow_dispatch:
  push:
  # Enable only after reviewing a manual trial run:
  # schedule:
  #   - cron: "0 14 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fims-community-digest
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Collect public activity and write an editorial draft
        id: collect
        uses: actions/github-script@v7
        env:
          DIGEST_REPOSITORIES: NOAA-FIMS/FIMS,NOAA-FIMS/noaa-fims.github.io,NOAA-FIMS/case-studies
        with:
          github-token: ${{ secrets.DIGEST_READ_TOKEN }}
          script: |
            const fs = require("node:fs");
            const end = new Date();
            const start = new Date(end.getTime() - 7 * 86400000);
            const since = start.toISOString();
            const until = end.toISOString();
            const date = until.slice(0, 10);
            const repositories = process.env.DIGEST_REPOSITORIES
              .split(",").map(x => x.trim());

            const evidence = { since, until, repositories: [] };

            const lines = [
              "---",
              `title: "FIMS community digest - ${date}"`,
              `date: ${date}`,
              "categories: [community-digest]",
              "draft: true",
              "---",
              "",
              `Activity window: ${since} to ${until} (UTC).`,
              "",
              "::: {.callout-warning}",
              "## Editorial draft",
              "This is a candidate list, not a finished community update.",
              "Add significance and invitations to participate; verify every claim.",
              "Keep draft: true until the post is ready for publication.",
              ":::",
              "",
              "## Three things to know",
              "",
              "_Editor: select up to three highlights and explain why they matter._",
              "",
            ];

            const label = text => String(text)
              .replace(/[\r\n]+/g, " ")
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/>/g, "&gt;")
              .replace(/[\\`*_[\]{}()!#|]/g, "\\$&");

            const inWindow = timestamp =>
              timestamp >= since && timestamp < until;

            const section = (heading, items) => {
              lines.push(`### ${heading}`, "");
              lines.push(...(items.length
                ? items
                : ["No matching activity in the retrieved sample."]));
              lines.push("");
            };

            for (const fullName of repositories) {
              const [owner, repo] = fullName.split("/");

              const { data: metadata } = await github.rest.repos.get({
                owner, repo,
              });

              if (metadata.private) {
                throw new Error(`Refusing private repository: ${fullName}`);
              }

              // Bounded retrieval for this mockup; disclose possible truncation.
              const { data: items } = await github.rest.issues.listForRepo({
                owner,
                repo,
                state: "all",
                since,
                sort: "updated",
                direction: "desc",
                per_page: 100,
              });

              const active = items.filter(item => inWindow(item.updated_at));

              let discussions = [];
              if (metadata.has_discussions) {
                const result = await github.graphql(`
                  query($owner: String!, $repo: String!) {
                    repository(owner: $owner, name: $repo) {
                      discussions(
                        first: 100,
                        orderBy: {field: UPDATED_AT, direction: DESC}
                      ) {
                        nodes {
                          title
                          url
                          updatedAt
                          closed
                        }
                      }
                    }
                  }
                `, { owner, repo });

                discussions = result.repository.discussions.nodes;
              }

              const { data: releases } = await github.rest.repos.listReleases({
                owner, repo, per_page: 100,
              });

              const published = releases.filter(r =>
                !r.draft && r.published_at && inWindow(r.published_at));

              evidence.repositories.push({
                repository: fullName,
                items: active,
                discussions,
                releases: published,
              });

              lines.push(`## ${fullName}`, "");

              if (
                items.length === 100 ||
                discussions.length === 100 ||
                releases.length === 100
              ) {
                lines.push(
                  "**Retrieval limit reached: coverage may be incomplete.**",
                  ""
                );
              }

              section(
                "Open discussions updated during the window",
                discussions
                  .filter(d => !d.closed && inWindow(d.updatedAt))
                  .slice(0, 10)
                  .map(d => `- [${label(d.title)}](${d.url})`)
              );

              section(
                "Open pull requests updated during the window",
                active
                  .filter(i => i.pull_request && i.state === "open")
                  .slice(0, 10)
                  .map(i => `- [${label(i.title)}](${i.html_url})`)
              );

              section(
                "Open issues updated during the window",
                active
                  .filter(i => !i.pull_request && i.state === "open")
                  .slice(0, 10)
                  .map(i => `- [${label(i.title)}](${i.html_url})`)
              );

              section(
                "Closed issues and pull requests updated during the window",
                active
                  .filter(i => i.state === "closed")
                  .slice(0, 10)
                  .map(i =>
                    `- [${label(i.title)}](${i.html_url})` +
                    " - verify outcome; closed does not mean merged or completed."
                  )
              );

              section(
                "Releases published during the window",
                published.slice(0, 10).map(r =>
                  `- [${label(r.name || r.tag_name)}](${r.html_url})` +
                  (r.prerelease ? " (prerelease)" : "")
                )
              );
            }

            lines.push(
              "## Community news and upcoming events",
              "",
              "_Editor: add confirmed announcements, dates, and registration links._",
              "",
              "## Ways to participate",
              "",
              "_Editor: select actionable requests for feedback, testing, or contributions._",
              "",
              "## Collection notes",
              "",
              "Public repositories only. Each section shows at most 10 candidates,",
              "ordered by recent updates.",
              "",
              "An update is a discovery signal, not proof of substantive progress",
              "or human participation.",
              "",
              "This mockup does not count comments, reviews, or distinct participants",
              "within the window, rank hot topics, or deduplicate previous digests.",
              ""
            );

            fs.mkdirSync("blog", { recursive: true });
            fs.mkdirSync("digest-evidence", { recursive: true });

            fs.writeFileSync(
              `blog/community-digest-${date}.qmd`,
              lines.join("\n")
            );

            fs.writeFileSync(
              "digest-evidence/activity.json",
              JSON.stringify(evidence, null, 2)
            );

            core.setOutput("date", date);

      - name: Preserve source data for editorial review
        uses: actions/upload-artifact@v4
        with:
          name: digest-evidence-${{ steps.collect.outputs.date }}
          path: digest-evidence/activity.json
          retention-days: 30

      - name: Open or update the draft review pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/community-digest-${{ steps.collect.outputs.date }}
          add-paths: blog/community-digest-${{ steps.collect.outputs.date }}.qmd
          draft: true
          title: "Draft community digest: ${{ steps.collect.outputs.date }}"
          commit-message: |
            Draft weekly FIMS community digest

            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          body: |
            Automatically collected candidates from selected public repositories.
            No publication or merge is automated.

            Editorial review:
            - Replace candidate lists with concise, evidence-linked highlights.
            - Distinguish proposals, merged work, and published releases.
            - Add confirmed news and a specific invitation to participate.
            - Review collection limits and the source-data artifact.
            - Render and preview the post.
            - Remove draft: true only when ready.