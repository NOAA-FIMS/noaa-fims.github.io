project:
  type: website
  render:
    - "*.qmd"
    - "sites/*.qmd"
    - "about/*.qmd"
    - "contact/*.qmd"
    - "blog/*.qmd"

  resources:
    - images/
    - assets/
    - about/FIMS_TOR_08.26.2021.pdf
    - fims-weekly/*.html
    - fims-weekly/redirect.js

website:
  favicon: images/FIMS_hexlogo.png
  title: "FIMS"
  site-url: "https://noaa-fims.github.io"
  repo-url: https://github.com/noaa-fims.github.io
  description: "News and updates from the Fisheries Integrated Modeling System project."
  open-graph: true
  navbar:
    title: "FIMS <small>{{< env VERSION >}}</small>"
    logo: images/FIMS_logo3.png
    logo-alt: "FIMS logo"
    background: light
    right:
      - text: home
        href: index.qmd
      - text: about
        menu:
          - text: overview
            href: about/index.qmd
          - text: faq
            href: about/faq.qmd
          - text: calendar
            href: about/calendar.qmd
          - text: changelog
            href: about/FIMS_CHANGELOG.qmd
          - text: acknowledgements
            href: about/acknowledgements.qmd
      - text: blog
        href: blog/index.qmd
      - text: packages & resources
        menu:
          - text: FIMS package
            href: https://noaa-fims.github.io/FIMS/
          - text: FIMS-associated R packages
            href: resources/packages.qmd
          - text: case studies
            href: https://noaa-fims.github.io/case-studies/
          - text: development resources
            href: resources/resources.qmd
          # - text: projects
          #   href: resources/projects.qmd
      - text: contact
        menu:
          - text: contact FIMS lead
            href: contact/index.qmd
          - text: FIMS team
            href: contact/contributors.qmd
      - icon: github
        aria-label: github icon
        href: https://github.com/NOAA-FIMS
  page-footer:
    border: false
    background: light
    left: >-
      <span id="copyright-year"></span> FIMS
    right: >-
      <a class="link-dark" href="https://github.com/NOAA-FIMS" title="FIMS on GitHub" aria-label="Visit FIMS on GitHub" target="_blank" rel="noopener"><i class="fab fa-github" aria-hidden="true"></i></a>
      <a class="link-dark" href="https://noaa-fisheries-integrated-toolbox.r-universe.dev" title="FIMS R Universe" aria-label="Visit FIMS R Universe repository" target="_blank" rel="noopener"><i class="fab fa-r-project" aria-hidden="true"></i></a>

format:
  html:
    lang: en
    body-width: 100%
    anchor-sections: true
    include-after-body: assets/open-in-new-tab.html
    scripts: 
      - assets/scripts.js
    header-includes: |
      <script>
        window.addEventListener('DOMContentLoaded', function() {
          var year = new Date().getFullYear();
          var el = document.getElementById('copyright-year');
          if (el) el.textContent = '© ' + year;
        });
      </script>
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    theme:
      light:
        - zephyr
        - assets/styles-elm-light.scss
        - assets/styles-elm-base.scss
        - assets/colors.scss
      dark:
        - assets/zephyr-dark.scss
        - assets/styles-elm-dark.scss
        - assets/styles-elm-base.scss
        - assets/colors.scss
    css:
      - assets/panelset-extras.css
    highlight-style:
      light: assets/syntax-elm-light.theme
      dark: assets/syntax-elm-dark.theme
    code-block-bg: false

execute:
  freeze: auto
