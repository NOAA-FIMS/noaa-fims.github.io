project:
  type: website
  render:
    - "*.qmd"
    - "sites/*.qmd"
    - "about/*.qmd"
    - "contact/*.qmd"
    - "blog/*.qmd"

  resources:
    - images/
    - assets/
    - about/FIMS_TOR_08.26.2021.pdf
    - fims-weekly/*.html
    - fims-weekly/redirect.js

website:
  favicon: images/FIMS_hexlogo.png
  title: "FIMS"
  site-url: "https://noaa-fims.github.io"
  repo-url: https://github.com/noaa-fims.github.io
  description: "News and updates from the Fisheries Integrated Modeling System project."
  open-graph: true
  navbar:
    title: "FIMS <small>{{< env VERSION >}}</small>"
    logo: images/FIMS_logo3.png
    logo-alt: "FIMS logo"
    background: light
    right:
      - text: home
        aria-label: link to home
        href: index.qmd
      - text: about
        href: about/index.qmd
      - text: get started
        href: get-started/index.qmd
      - text: blog
        aria-label: link to blog
        href: blog/index.qmd
      - text: packages & resources
        aria-label: link to FIMS resources
        menu:
          - text: FIMS package
            aria-label: link to FIMS package site
            href: https://noaa-fims.github.io/FIMS/
          - text: FIMS-associated R packages
            aria-label: link to FIMS R packages
            href: resources/packages.qmd
          - text: case studies
            href: https://noaa-fims.github.io/case-studies/
            aria-label: link to FIMS case studies site
          - text: development resources
            aria-label: link to development resources
            href: resources/resources.qmd
      - text: community
        href: community/index.qmd
          # - text: projects
          #   aria-label: link to FIMS projects
          #   href: resources/projects.qmd
      - text: contact
        aria-label: link to contacts
        menu:
          - text: contact FIMS lead
            aria-label: link to FIMS lead contact info
            href: contact/index.qmd
          - text: FIMS team
            aria-label: link to list of contributors
            href: contact/contributors.qmd
      - icon: github
        aria-label: github icon
        href: https://github.com/NOAA-FIMS
  sidebar:
    - id: about
      title: "About"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - text: About
          href: about/index.qmd
          icon: info-circle
        - text: "FAQ"
          icon: question-circle
          href: about/faq.qmd
        - text: "Model Architecture"
          href: about/architecture.qmd
          icon: diagram-3
        - text: "Calendar"
          href: about/calendar.qmd
          icon: calendar
        - text: "Changelog"
          href: about/FIMS_CHANGELOG.qmd
          icon: clock-history
        - text: "Contact"
          href: about/contact.qmd
          icon: envelope-arrow-up
        - text: "Contributors"
          href: about/contributors.qmd
          icon: people
    - id: get-started
      title: "Get Started"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - get-started/index.qmd
        - text: "Documentation"
          href: get-started/documentation.qmd
        - text: "Tutorials"
          href: get-started/tutorials.qmd
    - id: community
      title: "Community"
      style: "floating"
      collapse-level: 2
      align: left
      contents:
        - text: "Community Hub"
          href: community/index.qmd
          icon: people
        - text: "FIMS Blog"
          href: blog/index.qmd
          icon: layout-text-window
        # - text: "Events"
        #   href: 
        #   icon: calendar-event
        - text: "Projects & Publications"
          href: community/projects.qmd
          icon: book
           
    #       # - text: "User Hub"
    #       #   href: getting-started/user-hub.qmd
    #       # - text: "Contributor Hub"
    #       #   href: getting-started/contributor-hub.qmd

  page-footer:
    border: false
    background: light
    left: >-
      <span id="copyright-year"></span> FIMS
    right: >-
      <a class="link-dark" href="https://github.com/NOAA-FIMS" title="FIMS on GitHub" aria-label="Visit FIMS on GitHub" target="_blank" rel="noopener"><i class="fab fa-github" aria-hidden="true"></i></a>
      <a class="link-dark" href="https://noaa-fisheries-integrated-toolbox.r-universe.dev" title="FIMS R Universe" aria-label="Visit FIMS R Universe repository" target="_blank" rel="noopener"><i class="fab fa-r-project" aria-hidden="true"></i></a>

format:
  html:
    lang: en
    body-width: 100%
    anchor-sections: true
    include-after-body: 
      - assets/open-in-new-tab.html
    include-before-body: assets/skip-link.html
    scripts: 
      - assets/scripts.js
    header-includes: |
      <script>
        window.addEventListener('DOMContentLoaded', function() {
          var year = new Date().getFullYear();
          var el = document.getElementById('copyright-year');
          if (el) el.textContent = '© ' + year;
        });
      </script>
    include-in-header:
      - text: |
          <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
          <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    theme:
      light:
        - zephyr
        - assets/styles-elm-light.scss
        - assets/styles-elm-base.scss
        - assets/colors.scss
      dark:
        - assets/zephyr-dark.scss
        - assets/styles-elm-dark.scss
        - assets/styles-elm-base.scss
        - assets/colors.scss
    css:
      - assets/panelset-extras.css
    highlight-style:
      light: assets/syntax-elm-light.theme
      dark: assets/syntax-elm-dark.theme
    code-block-bg: false

execute:
  freeze: auto

