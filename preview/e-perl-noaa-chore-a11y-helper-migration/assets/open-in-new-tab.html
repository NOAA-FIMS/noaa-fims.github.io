<script>
document.addEventListener("DOMContentLoaded", function () {
  var forceNewTabPaths = [
    "/case-studies/",
    "/FIMS/",
    "/FIMSRTMB/",
    "/fims-pkgdown-template/",
    "/ecosystemom/",
    "/fishprior/"
  ];

  function applyInternalNewTabPaths() {
    document.querySelectorAll("a[href]").forEach(function (link) {
      var href = link.getAttribute("href");
      if (!href) return;

      try {
        var url = new URL(href, window.location.origin);
        var isForcedInternal = forceNewTabPaths.includes(url.pathname);

        if (url.hostname === window.location.hostname && isForcedInternal) {
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noopener noreferrer");
        }
      } catch (error) {
        console.warn("Skipping invalid link URL:", href, error);
      }
    });
  }

  function addNewTabWarnings() {
    document.querySelectorAll('a[target="_blank"]').forEach(function (link) {
      if (link.hasAttribute("data-new-tab-warning")) return;

      try {
        var url = new URL(link.href, window.location.origin);
        if (url.hostname === window.location.hostname && !forceNewTabPaths.includes(url.pathname)) {
          return;
        }
      } catch (error) {
        console.warn("Skipping invalid link URL:", link.href, error);
        return;
      }

      var warningText = " (opens in a new tab)";
      var ariaLabel = link.getAttribute("aria-label");
      var title = link.getAttribute("title");
      var labelledIcon = link.querySelector("i[aria-label], i[title]");
      var iconLabel = labelledIcon && (
        labelledIcon.getAttribute("aria-label") || labelledIcon.getAttribute("title")
      );
      var text = Array.from(link.childNodes)
        .filter(function (child) {
          return !(child.nodeType === Node.ELEMENT_NODE && child.classList.contains("a11y-sr-only"));
        })
        .map(function (child) {
          return child.textContent;
        })
        .join("")
        .trim();

      if (ariaLabel) {
        if (!ariaLabel.includes(warningText.trim())) {
          link.setAttribute("aria-label", ariaLabel + warningText);
        }
      } else if (iconLabel) {
        link.setAttribute("aria-label", iconLabel.trim() + warningText);
      } else if (title && !text) {
        link.setAttribute("aria-label", title + warningText);
      } else {
        var warning = document.createElement("span");
        warning.className = "a11y-sr-only";
        warning.textContent = warningText;
        link.appendChild(warning);
      }

      link.setAttribute("data-new-tab-warning", "true");
    });
  }

  applyInternalNewTabPaths();
  addNewTabWarnings();

  var warningObserver = new MutationObserver(function () {
    addNewTabWarnings();
  });
  warningObserver.observe(document.body, {
    attributes: true,
    attributeFilter: ["target"],
    childList: true,
    subtree: true
  });
});
</script>
