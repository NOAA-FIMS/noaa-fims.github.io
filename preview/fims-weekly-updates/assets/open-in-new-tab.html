<script>
document.addEventListener("DOMContentLoaded", function () {
  var forceNewTabPaths = [
    "/case-studies/",
    "/FIMS/",
    "/FIMSdiags/",
    "/FIMSRTMB/",
    "/fims-pkgdown-template/",
    "/ecosystemom/",
    "/fishprior/"
  ];

  document.querySelectorAll("a[href]").forEach(function (link) {
    var href = link.getAttribute("href");
    if (!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:")) {
      return;
    }

    try {
      var url = new URL(href, window.location.origin);
      var isExternal = url.hostname !== window.location.hostname;
      var isForcedInternal = forceNewTabPaths.includes(url.pathname);

      if (isExternal || isForcedInternal) {
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");

        // Accessibility Fix: Add a screen-reader-only warning if not already present
        if (!link.hasAttribute("data-new-tab-warning")) {
          var srWarning = document.createElement("span");
          srWarning.textContent = " (opens in a new tab)";

          // Use CSS to hide this text visually, but keep it available to screen readers
          srWarning.style.position = "absolute";
          srWarning.style.width = "1px";
          srWarning.style.height = "1px";
          srWarning.style.padding = "0";
          srWarning.style.margin = "-1px";
          srWarning.style.overflow = "hidden";
          srWarning.style.clip = "rect(0, 0, 0, 0)";
          srWarning.style.whiteSpace = "nowrap";
          srWarning.style.border = "0";
          
          link.appendChild(srWarning);
          // Prevent duplicates
          link.setAttribute("data-new-tab-warning", "true");
        }
      }
    } catch (error) {
      console.warn("Skipping invalid link URL:", href, error);
    }
  });
});
</script>
